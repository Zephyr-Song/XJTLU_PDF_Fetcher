name: Build Windows EXE

# 在「发布 Release」时自动把图形界面打包成单文件 exe，并作为附件挂到 Release 上。
# 如果仓库配置了代码签名证书（见下），会在上传前自动给 exe 签名，消除 SmartScreen 拦截。
on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    # 注意：secrets 上下文在 steps[*].if 里不可用（会让整个工作流文件被判为非法），
    # 所以统一在这里声明成 env，步骤里再用 env.xxx 判断。
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      CODESIGN_PFX: ${{ secrets.CODESIGN_PFX }}
      CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller build_exe.spec --noconfirm

      # ---------------- 代码签名（可选，未配置时自动跳过） ----------------

      - name: Upload unsigned EXE for signing
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        id: upload-unsigned
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: dist/XJTLU_PDF_Fetcher.exe
          if-no-files-found: error

      - name: Sign EXE with SignPath
        # 开源免费代码签名（SignPath Foundation 签发 OV 证书，私钥存于其 HSM）。
        # 需要仓库 Secrets / Variables：
        #   SIGNPATH_API_TOKEN            —— SignPath 控制台生成的 API token
        #   SIGNPATH_ORGANIZATION_ID      —— 组织 ID（Variables）
        #   SIGNPATH_PROJECT_SLUG         —— 项目 slug（Variables）
        #   SIGNPATH_SIGNING_POLICY_SLUG  —— 签名策略 slug（Variables）
        #   SIGNPATH_ARTIFACT_CONFIG_SLUG —— 产物配置 slug（Variables）
        # 未配置时自动跳过。免费计划每次发版需在 SignPath 门户人工点一次 Approve。
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        id: signpath
        continue-on-error: true
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Fetch signed EXE
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.signpath.outputs.signing-request-id }}
          path: signed

      - name: Replace EXE with signed one
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path "signed" -Filter *.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($signed) {
            Copy-Item $signed.FullName "dist/XJTLU_PDF_Fetcher.exe" -Force
            Write-Host "Signed EXE copied into dist/"
          } else {
            Write-Host "No signed EXE found, keeping the unsigned build."
          }

      - name: Sign EXE with own certificate
        # 备选路径：如果你有自购的代码签名证书（PFX），走这个步骤。
        # 需要两个仓库 Secrets：CODESIGN_PFX（base64 的 PFX）、CODESIGN_PASSWORD。
        # 与 SignPath 步骤互斥：SignPath 已启用时不再重复签。
        if: ${{ env.CODESIGN_PFX != '' && env.SIGNPATH_API_TOKEN == '' }}
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $pfx = "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX))
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin", "C:\Program Files\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found on runner" }
          & $signtool.FullName sign /f $pfx /p $env:CODESIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist/XJTLU_PDF_Fetcher.exe"
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed" }

      # ---------------- 打包与上传 ----------------

      - name: Package zip (exe + guide + unblock script)
        # 额外打一个 zip：里面是 exe + 中文使用说明 + 一键解除锁定脚本。
        # 用户用 7-Zip/WinRAR 解压通常不会带上 Mark-of-the-Web 标记，
        # 也不会再触发 SmartScreen；自带"全部解压缩"则仍会带标记，
        # 这时用压缩包里的「解除锁定.bat」一键清掉即可。
        shell: pwsh
        run: |
          $stage = "release-pkg"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "dist/XJTLU_PDF_Fetcher.exe" -Destination $stage
          Copy-Item "packaging/解除锁定.bat" -Destination $stage
          # 写成带 BOM 的 UTF-8，保证 Windows 记事本打开不乱码
          Get-Content "packaging/使用说明.txt" -Raw -Encoding UTF8 |
            Out-File "$stage/使用说明.txt" -Encoding utf8BOM
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/XJTLU_PDF_Fetcher-win-x64.zip" -Force
          Get-ChildItem "dist" | Select-Object Name, Length

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/XJTLU_PDF_Fetcher.exe
            dist/XJTLU_PDF_Fetcher-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
