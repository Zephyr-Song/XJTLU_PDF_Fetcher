name: Build Windows EXE

# 在「发布 Release」时自动把图形界面打包成单文件 exe，并作为附件挂到 Release 上。
# 如果仓库配置了代码签名证书（见下），会在上传前自动给 exe 签名，消除 SmartScreen 拦截。
on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller build_exe.spec --noconfirm

      - name: Package zip (exe + guide + unblock script)
        # 额外打一个 zip：里面是 exe + 中文使用说明 + 一键解除锁定脚本。
        # 用户用 7-Zip/WinRAR 解压通常不会带上 Mark-of-the-Web 标记，
        # 也不会再触发 SmartScreen；自带"全部解压缩"则仍会带标记，
        # 这时用压缩包里的「解除锁定.bat」一键清掉即可。
        shell: pwsh
        run: |
          $stage = "release-pkg"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "dist/XJTLU_PDF_Fetcher.exe" -Destination $stage
          Copy-Item "packaging/解除锁定.bat" -Destination $stage
          # 写成带 BOM 的 UTF-8，保证 Windows 记事本打开不乱码
          Get-Content "packaging/使用说明.txt" -Raw -Encoding UTF8 |
            Out-File "$stage/使用说明.txt" -Encoding utf8BOM
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/XJTLU_PDF_Fetcher-win-x64.zip" -Force
          Get-ChildItem "dist" | Select-Object Name, Length

      - name: Sign EXE with SignPath
        # 开源免费代码签名（SignPath Foundation 签发 OV 证书，私钥存于其 HSM）。
        # 需要仓库 Secrets / Variables：
        #   SIGNPATH_API_TOKEN              —— SignPath 控制台生成的 API token
        #   SIGNPATH_ORGANIZATION_ID        —— 组织 ID（可放 Variables）
        #   SIGNPATH_PROJECT_SLUG           —— 项目 slug
        #   SIGNPATH_SIGNING_POLICY_SLUG    —— 签名策略 slug
        #   SIGNPATH_ARTIFACT_CONFIG_SLUG   —— 产物配置 slug
        # 未配置时此步自动跳过，构建照常产出未签名 exe。
        # 注意：免费计划每次发版需在 SignPath 门户人工点一次 Approve，
        #       下面的 wait-for-completion 会等这次审批（超时 60 分钟）。
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          input-artifact-path: dist/XJTLU_PDF_Fetcher.exe
          output-artifact-path: dist/XJTLU_PDF_Fetcher.exe
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600

      - name: Sign EXE with own certificate
        # 备选路径：如果你有自购的代码签名证书（PFX），走这个步骤。
        # 需要两个仓库 Secrets：
        #   CODESIGN_PFX       —— 证书（含私钥）的 base64 编码 PFX
        #   CODESIGN_PASSWORD  —— PFX 的密码
        # 与 SignPath 步骤互斥：SignPath 已启用时不再重复签。
        if: ${{ secrets.CODESIGN_PFX != '' && secrets.SIGNPATH_API_TOKEN == '' }}
        env:
          CODESIGN_PFX: ${{ secrets.CODESIGN_PFX }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfx = "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX))
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin", "C:\Program Files\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found on runner" }
          & $signtool.FullName sign /f $pfx /p $env:CODESIGN_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist/XJTLU_PDF_Fetcher.exe"
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed" }

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/XJTLU_PDF_Fetcher.exe
            dist/XJTLU_PDF_Fetcher-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
