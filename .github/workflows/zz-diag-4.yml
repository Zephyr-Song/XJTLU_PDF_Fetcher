name: diag-env-in-if
on:
  push:
    branches: [main]
jobs:
  a:
    runs-on: ubuntu-latest
    env:
      CODESIGN_PFX: ${{ secrets.CODESIGN_PFX }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - name: step with env in if
        if: ${{ env.CODESIGN_PFX != '' && env.SIGNPATH_API_TOKEN == '' }}
        run: echo "diag4 ok"
